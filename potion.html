<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aunt Gilly's Gardenhouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="potion.css">
  <script src="potion.js" defer></script>
  <script src="room-navigation.js" defer></script>
</head>
<body>
  <header class="garden-header">
    <a href="index.html">← Back to Kylie's desk</a>
  </header>
  <main class="greenhouse">
    <img class="greenhouse-image" src="assets/potionassets/gillysgreenhouse.png" alt="A sunlit greenhouse with plants, a black cat, and a copper cauldron on the workbench.">
    <button class="cauldron-hotspot" id="openPotion" aria-label="Open the cauldron"></button>
  </main>
  <dialog id="potionDialog" aria-label="Brew a potion">
    <div class="potion-panel">
      <button class="close-button" id="closePotion" aria-label="Close potion">×</button>
      <div class="brewing-layout" id="brewingView">
        <section class="cauldron-area" aria-label="Your potion">
          <div class="cauldron-art" id="cauldronArt">
            <div class="potion-glow" aria-hidden="true"></div>
            <img class="cauldron-image" src="assets/potionassets/cauldron.png" alt="A black cat sitting beside a copper cauldron.">
          </div>
          <br> <br><br>
          <button class="brew-button" id="brewPotion" disabled>BREW</button>
          <button class="reset-button" id="resetPotion">RESET</button>
        </section>
        <div class="ingredient-shelf" id="ingredientShelf">
          <section aria-labelledby="ingredientsTitle">
            <h3 id="ingredientsTitle">Core Ingredients</h3>
            <div class="ingredient-grid" id="ingredientGrid"></div>
          </section>
          <section class="birthstone-shelf" aria-labelledby="birthstonesTitle">
            <h3 id="birthstonesTitle">Birth Stones</h3>
            <div class="ingredient-grid" id="birthstoneGrid"></div>
          </section>
        </div>
      </div>
      <section class="result-view" id="potionResult" aria-label="Your brewed potion" hidden>
        <img id="potionImage" class="result-image" alt="A freshly brewed potion">
        <div>
          <button class="brew-button" id="drinkPotion">Drink</button>
          <button class="reset-button" id="discardPotion">Discard</button>
        </div>
      </section>
      <section class="result-view" id="endGame" aria-label="Potion outcome" hidden>
        <img id="endGameImage" class="ending-image" alt="">
        <button class="reset-button" id="returnToGarden" hidden>Back in Time</button>
      </section>
    </div>
  </dialog>
</body>
</html>
